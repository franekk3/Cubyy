<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cubyy - Settings </title>
    <link rel="icon" type="image/png" href="./media/icons/icon.png">
    <link rel="stylesheet" href="./styles/m3-styles.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/css/dark.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <meta name="apple-mobile-web-app-title" content="Cubyy">
    <link rel="apple-touch-icon" href="./media/icons/icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            justify-content: flex-start;
            background-color: var(--md-sys-color-surface-container);
        }

        .setttings-label {
            font-family: sans-serif, 'Google Sans';
            font-weight: bold;
            font-size: 30px;
            color: #312252;
        }

        .settings-label {
            color: #E6E1E5;
            font-family: sans-serif, 'Google Sans';
            font-weight: bold;
            font-size: 30px;
        }
        .page-title {
            font-size: 20px; font-weight: bold;
        }
        @media screen and (max-width: 768px){ 
            .title-container {
                margin-left: 12px;
            }
        
        }
        #mobile-settings-button {
            background-color: var(--md-sys-color-primary-fixed-dim);
            margin-right: 5px;
        }
        .title-container {
            display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 4px;
        }
    </style>
</head>

<body ontouchstart="">
    <div class="top-bar">
        <div class="title-container">
            <img style="height: 26px; width: 26px;" src="./media/icons/cubyy-1.3-logo.svg">
            <p class="page-title"> Settings </p>
        </div>
        <div style="display: flex; flex-direction: row; width: fill-avilbe;">
        <div class="desktop-navbar" style="padding: 6px 12px;">
            <div onclick="window.location.href = './index.html'">
                <img src="./media/dm/home_white.png">
                <hr >
            </div>
            <div onclick="window.location.href = './solves.html'">

                <img src="./media/dm/list_white.png">
                <hr >
            </div>
            <div onclick="window.location.href = './stats.html'">
                <img src="./media/dm/bar_chart_white.png">
                <hr >
            </div>
            <div onclick="window.location.href = './settings.html'">

                <img src="./media/dm/settings_white.png">
                <hr class="selected">
            </div>
        </div>
        <button id="mobile-settings-button" class="bluetooth-button" onclick="window.location.href = './settings.html'"><img id="bluetoothIcon" src="./media/dm/settings_filled.png" alt="Connect Bluetooth timer"></button>

    </div>
    <div class="site-content">
        <div class="m3-card2" style="background-color: transparent;">
            <p> For now there are no settings to change! 😔 </p>
            <div class='rows-box'>
                <hr class="rows-hr">
                <p> Cubyy version: 1.3.0  </p>
                <hr class="rows-hr">
                <p onclick="window.location.href='https://github.com/franekk3'" style=" cursor: pointer;"> Cubyy by <b>
                        Franekk3 </b></a> </p>
                <hr class="rows-hr">
            </div>
            <div style="display: flex; justify-content: center; margin: 10px; flex-direction: row; gap: 25px;">
                <button onclick="window.location.href='./w/credits.html'" class="m3-ButtonWithIconWithAnimatedShapeSample">
                    Credits <img id="credits-button" class="m3-ButtonWithIconWithAnimatedShapeSample-icon" src="./media/dm/heart.png">
                </button>
                <button onclick="window.location.href='./w/terms.html'" class="m3-ButtonWithIconWithAnimatedShapeSample">
                    Terms & Policy <img id="terms-button" class="m3-ButtonWithIconWithAnimatedShapeSample-icon"
                        src="./media/dm/policy.png"> </button>
            </div>
            <div style="display: flex; justify-content: center; margin: 10px; flex-direction: row; gap: 25px;">
                <button onclick="window.location.href='https://github.com/franekk3/Cubyy'"
                    class="m3-ButtonWithIconWithAnimatedShapeSample"><img id="github-button"
                        class="m3-ButtonWithIconWithAnimatedShapeSample-icon" src="./media/dm/github.png"> GitHub
                </button>
                <button onclick="window.location.href='https://discord.gg/KXVR5aT6nf'"
                    class="m3-ButtonWithIconWithAnimatedShapeSample"><img id="discord-button"
                        class="m3-ButtonWithIconWithAnimatedShapeSample-icon" src="./media/dm/discord.png"> Discord
                </button>
            </div>
        </div>
    </div>



    <div class="nav-bar">
        <div onclick="window.location.href='./index.html'" class="nav-bar-element">
            <img id="home-button" class="nav-bar-image " src="./media/dm/home.png">
            <p class="nav-bar-label"> Home </p>
        </div>
        <div onclick="window.location.href='./solves.html'" class="nav-bar-element">
            <img id="add-button" class="nav-bar-image" src="./media/dm/list.png">
            <p class="nav-bar-label"> Solves </p>
        </div>
        <div onclick="window.location.href='./stats.html'" class="nav-bar-element">
            <img id="account-button" class="nav-bar-image"
                src="./media/dm/bar_chart.png">
            <p class="nav-bar-label"> Statistics </p>
        </div>
    </div>


    <script src="./script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Cubyy </title>
    <link rel="icon" type="image/png" href="./media/icons/icon.png">
    <link rel="stylesheet" href="./styles/m3-styles.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/css/dark.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
    <div class="top-bar">
        <div>
                <div class="spinner-container" style="position: relative; width: 100%; margin-bottom: 0px; display: flex; justify-content: center; align-items: center;">
                    <button id="sessionCubeButton" onclick="toggleSessionList()"

                        <span id="sessionCubeButtonText" style="font-size: 18px; margin-left: 4px; color: var(--md-sys-color-on-surface); width: 100%;">3x3 | 3x3</span>
                        <img id="arrowDownIconSession" height="20px" width="20px" src="./media/dm/arrow_down.png" alt="Open session list">
                    </button>
                    <div id="sessionListPopup" class="hidden2">
                        <div class="title">Select session</div>
                        <div id="sessionListItems" class="elements"></div>
                    </div>
                </div>
        </div>

        <div style="display: flex; flex-direction: row; width: fill-avilbe;">
        <div class="desktop-navbar">
            <div onclick="window.location.href = './index.html'">
                <img src="./media/dm/home_white.png">
                <hr class="selected">
            </div>
            <div onclick="window.location.href = './times.html'">

                <img src="./media/dm/list_white.png">
                <hr >
            </div>
            <div onclick="window.location.href = './settings.html'">

                <img src="./media/dm/settings_white.png">
                <hr >
            </div>
        </div>
            <button class="bluetooth-button"  onclick="inputTime()"><img id="inputIcon" src="./media/dm/input.png" alt="Input Time"></button>
                <button class="bluetooth-button" onclick="connectBluetooth()"><img id="bluetoothIcon" src="./media/dm/bluetooth.png" alt="Connect Bluetooth timer"></button>
        </div>
    </div>
    <div class="site-content">
        <div class="m3-card2" style="margin-bottom: -15px !important; display: flex; align-items: center;">
            <p id="scramble"> scramble </p>
        </div>
        <div class="m3-card" style=" height: 100%; min-height: 60%; width: 95%; margin-bottom: 0px !important; margin-top: -15px !important;">
            
            <div class="timer-display" id="timerDisplay" ontouchstart="handleTouchStart(event)"
                ontouchend="handleTouchEnd(event)"
                style="font-weight: bold; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;">
                <span id="timerNumbers">0.000</span>
                <p id="last-solve" class="last-time"></p>
                <div id="options-bar" class="options-bar" ontouchstart="event.stopPropagation()">
                    <img id="add2tosolve" class="options-bar-icon" src="./media/dm/+2.png">
                    <img id="addDnfToSolve" class="options-bar-icon" src="./media/dm/block.png">
                    <img id="deleteSolve" class="options-bar-icon" src="./media/dm/delete.png">
                </div>
            </div>
            <button onclick="showTimesListPupUp()" class="stats-trigger m3-ButtonWithAnimatedShapeSample"> Stats </button>
            <!-- Sessions List popup and trigger -->


        </div>
    </div>





    <div id="gantimerInfo"
        style="display: none; margin-top: 10px; padding: 10px; background: #e3f2fd; border: 1px solid #2196F3; border-radius: 16px;">
        <strong>GanTimer Info:</strong><br>
        <div id="gantimerState">-</div>
    </div>

    <div id="sessionModalOverlay" class="session-modal-overlay hidden2"
        style="position: fixed; inset: 0; z-index: 1100;"></div>
    <div id="sessionModal" class="session-modal hidden2">
        <h2>New session</h2>
        <input id="sessionNameInput" placeholder="Session name" aria-label="Session name">
        <div class="session-modal-buttons">
            <button class="tonal" onclick="closeSessionModal()">Cancel</button>
            <button class="primary" onclick="createSessionFromModal()">Create</button>
        </div>
    </div>

    <!-- Manual input time modal -->
    <div id="inputTimeOverlay" class="session-modal-overlay hidden2"
        onclick="closeInputTimeModal()" style="position: fixed; inset: 0; z-index: 1110;">
    </div>
    <div id="inputTimeModal" class="session-modal hidden2" style="z-index: 1111;" style="padding: 10px;">
        <h2>Manual time entry</h2>
        <label style="display:block; font-weight:700; font-size: 19px; margin-bottom: 10px;">Time</label>
        <input id="manualTimeInput" placeholder="e.g. 13.456 or 1:23.789" aria-label="Time input">
        <label style="display:block; font-weight:700; font-size: 19px; margin-top:0px; margin-bottom: 10px;">Scramble</label>
        <div style="display: flex; flex-direction: row; margin-bottom: 10px; justify-content: center; align-items: center; gap: 10px;">
            <textarea id="manualScrambleInput" rows="2" style="padding: 10px; width: 76%; border-radius: 16px; color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface-container-low);"></textarea>
                <label class="switch">
                    <input  type="checkbox" id="useCurrentScramble" checked>
                    <span class="slider round"></span>
                </label>
        </div>
        <label for="useCurrentScramble" style="font-size: 10px; font-weight: bold; margin-bottom: 0px;"> Check to use current scramble</label>
        <label style="display:block; font-weight:700; margin-top: 10px; font-size: 19px; margin-bottom: 0px;">Date</label>
        <div style="display: flex; flex-direction: row; margin-bottom: -5px; justify-content: center; align-items: center; gap: 10px; ">
            <input id="manualDateInput" type="datetime-local" style="width: 76%; margin-top: 15px;">
                <label class="switch">
                    <input  type="checkbox" id="useCurrentDate" checked>
                    <span class="slider round"></span>
                </label>
        </div>
        <label for="useCurrentDate" style="font-size: 10px; font-weight: bold; margin-bottom: 10px;"> Check to use current date/time</label>
        

        <div class="session-modal-buttons" style="margin-top:10px;">
            <button class="tonal" onclick="closeInputTimeModal()">Cancel</button>
            <button class="primary" onclick="saveInputTime()">Save</button>
        </div>
    </div>
    <p style="margin: 50px"> </p>
    <div id="notificationsBox" class="notification">
        <p> </p>
    </div>
    <div class="nav-bar">
        <div onclick="window.location.href='./index.html'" class="nav-bar-element">
            <img id="home-button" class="nav-bar-image nav-bar-image-choosed" src="./media/dm/home_filled.png">
            <p class="nav-bar-label"> Home </p>
        </div>
        <div onclick="window.location.href='./times.html'" class="nav-bar-element">
            <img id="add-button" class="nav-bar-image" src="./media/dm/list.png">
            <p class="nav-bar-label"> Times </p>
        </div>
        <div onclick="window.location.href='./settings.html'" class="nav-bar-element">
            <img id="account-button" class="nav-bar-image" src="./media/dm/settings.png">

        </div>

    <div onclick='hideTimesListPupUp()' class="hidden2"
        style="background-color: #000000cb; position: absolute; top: 0px; bottom: 0px; left: 0px; right: 0px; z-index: 1000;"
        id="overlay"></div>

    </div>
    <div class="anim-open  hidden2 drawer-box" id="main-container">
        <div id="iframe-shield"
            style="display: none; position: absolute; top: 40px; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent;">
        </div>
        <div onclick='hideTimesListPupUp()' id="drag-handle"
            style="width: 100%; height: 40px; cursor: grab; display: flex; justify-content: center; align-items: center; z-index: 20;">
            <hr
                style="width: 30px; height: 4px; border: none; border-radius: 2px; background-color: #515052; margin: 10px;">
        </div>
        <div class="m3-card2"
            style=" margin: 10px; height: 100%; overflow-y: auto; width: 90%; max-width: 576px; justify-content: center; align-items: center; margin: 10px; margin-top: 0px;">
            <div style="display: flex; flex-direction: row; gap: 10px; justify-content: center; margin: 10px;">
                <div class="m3-card-small1">
                    <p id='currentAo5' class="time-label1"> 0 </p>
                    <p class="description-label1"> Current Ao5 </p>
                </div>
                <div
                    style="display: flex; flex-direction: column; gap: 10px; justify-content: center; margin-right: 10px;">
                    <div class="m3-card-small2">
                        <p id='currentAo12' class="time-label2"> 0 </p>
                        <p class="description-label2"> Current Ao12 </p>
                    </div>
                    <div class="m3-card-small2">
                        <p id='currentAo100' class="time-label2"> 0 </p>
                        <p class="description-label2"> Current Ao100 </p>
                    </div>
                </div>

            </div>
            <div style="display: flex; flex-direction: row; gap: 10px; justify-content: center; margin: 10px;">
                <div
                    style="display: flex; flex-direction: column; gap: 10px; justify-content: center; margin-right: 10px;">
                    <div class="m3-card-small2">
                        <p id='currentAllAvg' class="time-label2"> 0 </p>
                        <p class="description-label2"> All times Average </p>
                    </div>
                    <div class="m3-card-small2">
                        <p id='PersonalWorst' class="time-label2"> 0 </p>
                        <p class="description-label2"> Personal Worst </p>
                    </div>
                </div>
                <div class="m3-card-small1">
                    <p id='PersonalBest' class="time-label1"> 0 </p>
                    <p class="description-label1"> Personal Best </p>
                </div>
            </div>
            <div style="display: flex; flex-direction: row; gap: 10px; justify-content: center; margin: 10px;">
                <div class="m3-card-small1">
                    <p id='bestAo5' class="time-label1"> 0 </p>
                    <p class="description-label1"> Best Ao5 </p>
                </div>
                <div class="m3-card-small1">
                    <p id="solvesCount" class="time-label1"> 0 </p>
                    <p class="description-label1"> Solves Count </p>
                </div>
            </div>

        </div>
    </div>

    </div>

    <script src="./script.js"></script>

    <script>



        const OverLay = document.getElementById('overlay');
        const TimesListPupUp = document.getElementById('main-container');
        const handle = document.getElementById('drag-handle');
        const shield = document.getElementById('iframe-shield');
        let startY = 0;
        let isDragging = false;

        function enableShield(on) {
            shield.style.display = on ? 'block' : 'none';
        }

        // --- OBSŁUGA DOTYKU (Mobile) ---
        handle.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
            isDragging = true;
            enableShield(true); 
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (!isDragging) return;

            const endY = e.changedTouches[0].clientY;
            handleGesture(startY, endY);

            isDragging = false;
            enableShield(false); 
        }, { passive: true });

        handle.addEventListener('mousedown', e => {
            startY = e.clientY;
            isDragging = true;
            enableShield(true);

            const onMouseUp = (upEvent) => {
                handleGesture(startY, upEvent.clientY);
                isDragging = false;
                enableShield(false);
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mouseup', onMouseUp);
        });

        function handleGesture(start, end) {
            const threshold = 50;
            const diff = end - start;
            if (Math.abs(diff) > threshold) {
                if (diff > 0) hideTimesListPupUp();
                else funkcjaDlaGory();
            }
        }

        function hideTimesListPupUp() {
            enableScroll()
            OverLay.classList.add('hidden2');
            TimesListPupUp.classList.add('anim-close');
            setTimeout(() => {
                TimesListPupUp.classList.add('hidden2');
            }, 300);
        }
        function showTimesListPupUp() {
            disableScroll()
            TimesListPupUp.classList.remove('hidden2');
            TimesListPupUp.classList.remove('anim-close');
            OverLay.classList.remove('hidden2');

        }
        function disableScroll() {
            document.body.classList.add('no-scroll');
        }

        function enableScroll() {
            document.body.classList.remove('no-scroll');
        }
    </script>
</body>

</html>

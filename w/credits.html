<body ontouchstart="">
    <div style="position: fixed; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; display: flex; border-radius: 16px; padding: 2px;" onclick="window.location.href = '../settings.html'">
        <img src="../media/dm/arrow_down-old.png" style="height: 38px; rotate: 90deg; ">
    </div>
    <div class="m3-card2">
        <p class="credits-label"> Credits </p>
        <p> List of credits ☺️ </p>
        <div class='rows-box'>
            <hr class="rows-hr">
            <p onclick="window.location.href='https://fonts.google.com'" style=" cursor: pointer;"> Icons & "Google
                Sans" font by <b>Google</b></p>
            <hr class="rows-hr">
            <p onclick="window.location.href='https://m3.material.io/'" style=" cursor: pointer;"> <B>Material 3</B>
                Design like design inspirated from <b>Google</b> </p>

                    Franekk3 </b></a> </p>
            <hr class="rows-hr">

        </div>

    </div>

    <div class="nav-bar">
        <div onclick="window.location.href='../index.html'; navigator.vibrate(100)" class="nav-bar-element">
            <img id="home-button" class="nav-bar-image " src="../media/dm/home.png">
            <p class="nav-bar-label"> Home </p>
        </div>
        <div onclick="window.location.href='../times.html'; navigator.vibrate(100)" class="nav-bar-element">
            <img id="add-button" class="nav-bar-image" src="../media/dm/list.png">

        <div onclick="window.location.href='../settings.html'; navigator.vibrate(100)" class="nav-bar-element">
            <img id="account-button" class="nav-bar-image nav-bar-image-choosed"
                src="../media/dm/settings_filled.png">
            <p class="nav-bar-label"> Settings </p>
        </div>
    </div>


    <script>
        const themeStylesheet = document.createElement("link");
        themeStylesheet.rel = "stylesheet";
        document.head.appendChild(themeStylesheet);

        function isMobileDevice() { 
        return window.matchMedia("(max-width: 768px)").matches; 
        }

        function updateStyles() {
        const targetCss = isMobileDevice() ? "../styles/style-mobile.css" : "../styles/style-desktop.css";
        
        if (themeStylesheet.getAttribute("href") !== targetCss) {
            themeStylesheet.href = targetCss;
        }
        }

        updateStyles();

        window.addEventListener("resize", updateStyles);
    </script>
</body>

</html>
